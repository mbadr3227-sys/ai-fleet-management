<!DOCTYPE html>
<html>
<head>
    <title>Drivers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

<div class="container mt-5">

    <h1 class="text-warning">🚛 Drivers Management</h1>

    <a href="#" id="editBtn" class="btn btn-primary">Edit Driver</a>

    <a href="#" id="deleteBtn" class="btn btn-danger">Delete Driver</a>

    <a href="/add_driver" class="btn btn-success mt-3">Add Driver</a>

    <table class="table table-dark table-striped mt-4">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>email</th>
                <th>phone</th>
                <th>User id</th>
                <th>Select</th>
            </tr>
        </thead>

        <tbody>
        {% for driver in drivers %}
        <tr>
            <td>{{ driver.id }}</td>
            <td>{{ driver.name }}</td>
            <td>{{ driver.email }}</td>
            <td>{{ driver.phone }}</td>
            <td>{{ driver.user_id }}</td>

            </td>
                <input type="radio" name="selected_driver" value="{{ driver.id }}">
            <td>
        </td>
        {% endfor %}
        </tbody>
    </table>

    <a href="/" class="btn btn-warning">
        Back Dashboard
    </a>

</div>
<script>
document.getElementById("editBtn").onclick = function() {
    let selected = document.querySelector(
        'input[name="selected_driver"]:checked'
    );

    if(selected){
        window.location.href =
        "/edit_driver/" + selected.value;
    }else{
        alert("Choose a driver first");
    }
};

document.getElementById("deleteBtn").onclick = function() {
    let selected = document.querySelector(
        'input[name="selected_driver"]:checked'
    );

    if(selected){
        window.location.href =
        "/delete_driver/" + selected.value;
    }else{
        alert("Choose a driver first");
    }
};
</script>
</body>
</html>
