<!DOCTYPE html>
<html>
<head>
    <title>Vans</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">
<div class="container mt-5">

    <h1 class="text-warning">🚐 Vans Management</h1>

    <a href="/add_van" class="btn btn-success mb-3">Add Van</a>

    <form method="POST" action="/delete_van" class="mb-3">

        <select name="reg" class="form-select mb-2">
            {% for van in vans %}
            <option value="{{ van.reg }}">{{ van.reg }}</option>
            {% endfor %}
        </select>

        <button type="submit" class="btn btn-danger">
            Delete Selected Van
        </button>

</form>
    <table class="table table-dark table-striped mt-4">
        <thead>
            <tr>
                <th>Reg</th>
                <th>Model</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
        {% for van in vans %}
        <tr>
            <td>{{ van.reg }}</td>
            <td>{{ van.model }}</td>
            <td>{{ van.status }}</td>
        </tr>
        {% endfor %}
        </tbody>
    </table>

    <a href="/" class="btn btn-warning">Back Dashboard</a>

</div>
</body>
</html>
