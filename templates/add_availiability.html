{% extends "base.html" %}

{% block title %}Add availability — Fleet Control{% endblock %}

{% block content %}

<span class="eyebrow">Rota</span>
<h1 class="mt-2">Add availability</h1>
<p class="muted">Record a day a driver is able to work.</p>

<div class="panel reveal mt-4" style="max-width:520px">
  <form method="POST">

    <div class="mb-3">
      <label for="driver">Driver</label>
      <input type="text" name="driver" id="driver" class="form-control" placeholder="Driver name" required>
    </div>

    <div class="mb-3">
      <label for="day">Day</label>
      <select name="day" id="day" class="form-select" required>
        <option>Monday</option>
        <option>Tuesday</option>
        <option>Wednesday</option>
        <option>Thursday</option>
        <option>Friday</option>
        <option>Saturday</option>
        <option>Sunday</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="time">Available time</label>
      <input type="text" name="time" id="time" class="form-control" placeholder="07:00 – 17:00" required>
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:22px">
      <button type="submit" class="btn btn-fleet">Save availability</button>
      <a href="/availability" class="btn btn-ghost">Cancel</a>
    </div>

  </form>
</div>

{% endblock %}
