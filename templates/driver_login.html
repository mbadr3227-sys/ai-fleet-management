{% extends "base.html" %}

{% block title %}Driver login — Fleet Control{% endblock %}

{% block content %}

<div style="max-width:440px;margin:40px auto">
  <span class="eyebrow">Driver portal</span>
  <h1 class="mt-2">Sign in</h1>
  <p class="muted">Use the email and user ID from your driver record.</p>

  <div class="panel reveal mt-4">
    <form method="POST">

      <div class="mb-3">
        <label for="email">Email</label>
        <input type="email" name="email" id="email" class="form-control" placeholder="name@example.com" required>
      </div>

      <div class="mb-3">
        <label for="user_id">User ID</label>
        <input type="text" name="user_id" id="user_id" class="form-control mono" placeholder="4 digits" required>
      </div>

      <button class="btn btn-fleet" style="width:100%;margin-top:14px">Sign in</button>

    </form>
  </div>

  <p class="muted mt-3" style="font-size:13px">
    Lost your user ID? Ask an admin to check the drivers list.
  </p>
</div>

{% endblock %}
