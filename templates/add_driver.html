{% extends "base.html" %}

{% block title %}Add driver — Fleet Control{% endblock %}

{% block content %}

<span class="eyebrow">Roster</span>
<h1 class="mt-2">Add a driver</h1>
<p class="muted">A user ID is generated automatically once the record is saved.</p>

<div class="panel reveal mt-4" style="max-width:520px">
  <form method="POST">

    <div class="mb-3">
      <label for="name">Name</label>
      <input type="text" name="name" id="name" class="form-control" placeholder="Full name" required>
    </div>

    <div class="mb-3">
      <label for="email">Email</label>
      <input type="email" name="email" id="email" class="form-control" placeholder="name@example.com" required>
    </div>

    <div class="mb-3">
      <label for="phone">Phone number</label>
      <input type="tel" name="phone" id="phone" class="form-control" placeholder="07…" required>
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:22px">
      <button type="submit" class="btn btn-fleet">Save driver</button>
      <a href="/drivers" class="btn btn-ghost">Cancel</a>
    </div>

  </form>
</div>

{% endblock %}
