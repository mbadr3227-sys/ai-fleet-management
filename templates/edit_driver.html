<!DOCTYPE html>
<html>
<head>
    <title>Edit Driver</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

<div class="container mt-5">

    <h1 class="text-warning">✏️ Edit Driver</h1>

    <form method="POST">

        <div class="mb-3">
            <label>Name</label>
            <input type="text" name="name" class="form-control" value="{{ driver.name }}" required>
        </div>

        <div class="mb-3">
            <label>License</label>
            <input type="text" name="license" class="form-control" value="{{ driver.license }}" required>
        </div>

        <button type="submit" class="btn btn-primary">Update Driver</button>

        <a href="/drivers" class="btn btn-warning">Back</a>

    </form>

</div>

</body>
</html>
