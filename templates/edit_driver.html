{% extends "base.html" %}

{% block title %}Edit driver — Fleet Control{% endblock %}

{% block content %}

<span class="eyebrow">Roster</span>
<h1 class="mt-2">Edit driver</h1>
<p class="muted">Updating the record for {{ driver.name }}.</p>

<div class="panel reveal mt-4" style="max-width:520px">
  <form method="POST">

    <div class="mb-3">
      <label for="name">Name</label>
      <input type="text" name="name" id="name" class="form-control" value="{{ driver.name }}" required>
    </div>

    <div class="mb-3">
      <label for="license">Licence class</label>
      <input type="text" name="license" id="license" class="form-control" value="{{ driver.license }}" required>
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:22px">
      <button type="submit" class="btn btn-fleet">Save changes</button>
      <a href="/drivers" class="btn btn-ghost">Cancel</a>
    </div>

  </form>
</div>

{% endblock %}
