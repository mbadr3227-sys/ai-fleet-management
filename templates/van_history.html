<!DOCTYPE html>
<html>
<head>
    <title>Van History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">
<div class="container mt-5">

    <h1 class="text-warning">Search Van History by Date</h1>

    <form method="POST" class="mb-4">
        <label>Date</label>
        <input type="date" name="work_date" class="form-control mb-3" required>

        <button class="btn btn-success">Search</button>
    </form>

    <table class="table table-dark table-striped">
        <thead>
            <tr>
                <th>Driver</th>
                <th>Email</th>
                <th>Van</th>
                <th>Date</th>
                <th>Shift</th>
                <th>Notes</th>
            </tr>
        </thead>

        <tbody>
        {% for item in records %}
            <tr>
                <td>{{ item.driver_name }}</td>
                <td>{{ item.driver_email }}</td>
                <td>{{ item.van_reg }}</td>
                <td>{{ item.work_date }}</td>
                <td>{{ item.shift_time }}</td>
                <td>{{ item.notes }}</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>

    <a href="/" class="btn btn-warning">Back Dashboard</a>

</div>
</body>
</html>
