<!DOCTYPE html>
<html>
<head>
    <title>Availability</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">
<div class="container mt-5">

    <h1 class="text-warning">📅 Driver Availability</h1>

    <a href="/add_availability" class="btn btn-success mb-3">Add Availability</a>

    <form method="POST" action="/delete_availability" class="mb-3">

        <select name="driver" class="form-select mb-2">
            {% for item in availability %}
            <option value="{{ item.driver }}">{{ item.driver }}</option>
            {% endfor %}
        </select>

        <button type="submit" class="btn btn-danger">
            Delete Selected Driver
        </button>

    </form>
    <table class="table table-dark table-striped mt-4">
        <thead>
            <tr>
                <th>Driver</th>
                <th>Day</th>
                <th>Available Time</th>
            </tr>
        </thead>
        <tbody>
        {% for item in availability %}
        <tr>
            <td>{{ item.driver }}</td>
            <td>{{ item.day }}</td>
            <td>{{ item.time}}</td>
        </tr>
        {% endfor %}
        </tbody>
    </table>

    <a href="/" class="btn btn-warning">Back Dashboard</a>

</div>
</body>
</html>
