{% extends "base.html" %}

{% block title %}Add van — Fleet Control{% endblock %}

{% block content %}

<span class="eyebrow">Vehicles</span>
<h1 class="mt-2">Add a van</h1>
<p class="muted">New vehicles become claimable by drivers straight away.</p>

<div class="panel reveal mt-4" style="max-width:520px">
  <form method="POST">

    <div class="mb-3">
      <label for="reg">Registration</label>
      <input type="text" name="reg" id="reg" class="form-control mono" placeholder="AB12 CDE" required>
    </div>

    <div class="mb-3">
      <label for="model">Model</label>
      <input type="text" name="model" id="model" class="form-control" placeholder="Ford Transit" required>
    </div>

    <div class="mb-3">
      <label for="status">Status</label>
      <select name="status" id="status" class="form-select" required>
        <option>Available</option>
        <option>In service</option>
        <option>Off road</option>
      </select>
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:22px">
      <button type="submit" class="btn btn-fleet">Save van</button>
      <a href="/vans" class="btn btn-ghost">Cancel</a>
    </div>

  </form>
</div>

{% endblock %}
