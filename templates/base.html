<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Fleet Control{% endblock %}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0E1520; --bg-2:#121C29; --panel:#16202D; --line:#25344a;
  --text:#E8EEF6; --muted:#93A5BC;
  --accent:#FFB020; --accent-ink:#1A1206; --accent-soft:rgba(255,176,32,.14);
  --ok:#39D98A; --danger:#FF5C5C;
  --radius:14px;
  --shadow:0 18px 40px rgba(0,0,0,.35);
}
[data-theme="light"]{
  --bg:#EEF1F5; --bg-2:#E4E9F0; --panel:#FFFFFF; --line:#D4DCE6;
  --text:#141C26; --muted:#5B6B80;
  --accent:#E08A00; --accent-ink:#FFFFFF; --accent-soft:rgba(224,138,0,.12);
  --shadow:0 12px 28px rgba(20,28,38,.10);
}

*{box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
  display:flex; flex-direction:column;
  transition:background .25s ease,color .25s ease;
}
h1,h2,h3,h4,.display-font{
  font-family:'Barlow Condensed','Inter',sans-serif;
  font-weight:700; letter-spacing:.02em; text-transform:uppercase;
}
h1{font-size:clamp(28px,7vw,46px)}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent)}
.muted{color:var(--muted)}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}

/* ---------- hi-vis chevron stripe (signature) ---------- */
.chevron-bar{
  height:6px;
  background:repeating-linear-gradient(115deg,var(--accent) 0 18px,transparent 18px 36px);
  opacity:.9;
}

/* ---------- nav ---------- */
.topbar{
  position:sticky; top:0; z-index:50;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:1140px;margin:0 auto;padding:12px 18px;
  display:flex;align-items:center;gap:14px;
}
.brand{display:flex;align-items:center;gap:10px;color:var(--text);font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.brand-mark{
  width:30px;height:30px;border-radius:8px;
  background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-size:16px;font-weight:700;
}
.nav-links{display:flex;gap:6px;margin-left:auto;align-items:center;flex-wrap:wrap}
.nav-links a{
  color:var(--muted);font-size:14px;font-weight:500;
  padding:8px 12px;border-radius:9px;
}
.nav-links a:hover{color:var(--text);background:var(--bg-2)}
.nav-links a.active{color:var(--accent);background:var(--accent-soft)}
.icon-btn{
  background:var(--bg-2);border:1px solid var(--line);color:var(--text);
  width:38px;height:38px;border-radius:10px;font-size:16px;cursor:pointer;
}
.icon-btn:hover{border-color:var(--accent)}
.burger{display:none}
@media(max-width:820px){
  .burger{display:block;margin-left:auto}
  .nav-links{
    display:none;width:100%;order:3;margin-left:0;
    flex-direction:column;align-items:stretch;gap:2px;padding-top:8px;
  }
  .nav-links.open{display:flex}
  .nav-links a{padding:12px}
}

/* ---------- layout ---------- */
.page{max-width:1140px;margin:0 auto;padding:28px 18px 56px;width:100%;flex:1}
.eyebrow{
  font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--accent);
}

/* ---------- panels & cards ---------- */
.panel{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);
}
.tile{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:20px;height:100%;
  box-shadow:var(--shadow);
  transition:transform .2s ease,border-color .2s ease;
}
.tile:hover{transform:translateY(-4px);border-color:var(--accent)}
.tile h3{font-size:20px;margin-bottom:6px}
.tile p{color:var(--muted);font-size:14px;margin-bottom:16px}
.stat{font-family:'JetBrains Mono',monospace;font-size:36px;font-weight:700;color:var(--accent);line-height:1}
.stat-label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:8px}

/* plate chip — vehicle / driver IDs */
.plate{
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;
  background:var(--accent);color:var(--accent-ink);
  padding:3px 9px;border-radius:5px;letter-spacing:.06em;
}
.pill{font-size:12px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.busy{color:var(--danger);border-color:var(--danger)}

/* ---------- buttons ---------- */
.btn-fleet{
  background:var(--accent);color:var(--accent-ink);border:none;
  padding:10px 20px;border-radius:10px;font-weight:600;font-size:14px;
}
.btn-fleet:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn-ghost{
  background:transparent;color:var(--text);border:1px solid var(--line);
  padding:10px 20px;border-radius:10px;font-weight:600;font-size:14px;
}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- forms & tables ---------- */
.form-control,.form-select,textarea{
  background:var(--bg-2)!important;border:1px solid var(--line)!important;
  color:var(--text)!important;border-radius:10px!important;padding:11px 13px!important;
}
.form-control:focus,textarea:focus{border-color:var(--accent)!important;box-shadow:0 0 0 3px var(--accent-soft)!important}
.form-control::placeholder{color:var(--muted)!important}
label{font-size:13px;color:var(--muted);margin-bottom:6px;display:block}

.table{color:var(--text)!important;margin:0}
.table thead th{
  background:var(--bg-2)!important;color:var(--muted)!important;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  border-bottom:1px solid var(--line)!important;padding:12px!important;
}
.table td{border-color:var(--line)!important;padding:12px!important;vertical-align:middle;background:transparent!important}
.table tbody tr:hover td{background:var(--bg-2)!important}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}

/* ---------- motion ---------- */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .5s ease,transform .5s ease}
.reveal.shown{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){
  .reveal{opacity:1;transform:none;transition:none}
  .tile:hover{transform:none}
}

/* ---------- footer ---------- */
.site-footer{
  border-top:1px solid var(--line);background:var(--bg-2);
  padding:24px 18px;color:var(--muted);font-size:13px;
}
.site-footer .inner{max-width:1140px;margin:0 auto;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
{% block extra_css %}{% endblock %}
</head>

<body>

<div class="chevron-bar"></div>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/">
      <span class="brand-mark">F</span> Fleet Control
    </a>

    <button class="icon-btn burger" id="burger" aria-label="Menu">☰</button>

    <nav class="nav-links" id="navLinks">
      <a href="/">Dashboard</a>
      <a href="/drivers">Drivers</a>
      <a href="/vans">Vans</a>
      <a href="/availability">Availability</a>
      <a href="/current_allocations">Allocations</a>
      <a href="/van_history">History</a>
      <a href="/ai_assistant">AI Assistant</a>
      <a href="/driver_login">Driver Login</a>
      <button class="icon-btn" id="themeBtn" aria-label="Switch theme">☾</button>
    </nav>
  </div>
</header>

<main class="page">
  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="inner">
    <span>Fleet Control — drivers, vans and daily allocations.</span>
    <span class="mono">Flask · SQLite · OpenAI</span>
  </div>
</footer>

<script>
// mobile menu
document.getElementById('burger').addEventListener('click', function(){
  document.getElementById('navLinks').classList.toggle('open');
});

// theme toggle
(function(){
  var root = document.documentElement, btn = document.getElementById('themeBtn');
  var saved = null;
  try { saved = localStorage.getItem('fleet-theme'); } catch(e){}
  if (saved) root.setAttribute('data-theme', saved);
  var sync = function(){ btn.textContent = root.getAttribute('data-theme') === 'light' ? '☀' : '☾'; };
  sync();
  btn.addEventListener('click', function(){
    var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('fleet-theme', next); } catch(e){}
    sync();
  });
})();

// highlight current page
(function(){
  var path = window.location.pathname;
  document.querySelectorAll('.nav-links a').forEach(function(a){
    if (a.getAttribute('href') === path) a.classList.add('active');
  });
})();

// scroll reveal
(function(){
  var items = document.querySelectorAll('.reveal');
  if (!('IntersectionObserver' in window)) {
    items.forEach(function(el){ el.classList.add('shown'); });
    return;
  }
  var obs = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if (e.isIntersecting){ e.target.classList.add('shown'); obs.unobserve(e.target); }
    });
  }, { threshold: 0.12 });
  items.forEach(function(el, i){
    el.style.transitionDelay = Math.min(i * 60, 300) + 'ms';
    obs.observe(el);
  });
})();
</script>

{% block extra_js %}{% endblock %}
</body>
</html>
