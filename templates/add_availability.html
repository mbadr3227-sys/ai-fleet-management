<!DOCTYPE html>
<html>
<head>
    <title>Add Availability</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">
<div class="container mt-5">

    <h1 class="text-warning">📅 Add Availability</h1>

    <form method="POST">
       <div class="mb-3">
           <label>Driver</label>
           <input type="text" name="driver" class="form-control" required>
       </div>

       <div class="mb-3">
           <label>Day</label>
           <input type="text" name="day" class="form-control" required>
       </div>

       <div class="mb-3">
           <label>Time</label>
           <input type="text" name="time" class="form-control" required>
       </div>

       <button class="btn btn-success">Save Availability</button>
       <a href="/availability" class="btn btn-warning">Back</a>
    </form>

</div>
</body>
</html>
