<!DOCTYPE html>
<html>
<head>
    <title>Driver Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

<div class="container mt-5">

<h1 class="text-warning">Welcome {{ name }}</h1>

<p>Email: {{ email }}</p>
<p>User ID: {{ user_id }}</p>

<hr>

<form method="POST">

    <div class="mb-3">
        <label>Van Registration</label>

        <select name="van_reg" class="form-control" required>

            {% for van in vans %}

            <option value="{{ van.reg }}">
                {{ van.reg }}
            </option>

            {% endfor %}

</select>
    </div>

    <div class="mb-3">
        <label>Date</label>
        <input type="date" name="work_date" value="{{ today }}" readonly required>
    </div>

    <div class="mb-3">
        <label>Shift</label>
        <select name="shift_time" class="form-control">
            <option>Day</option>
            <option>Night</option>
        </select>
    </div>

    <div class="mb-3">
        <label>Notes</label>
        <textarea name="notes" class="form-control"></textarea>
    </div>

    <button type="submit" class="btn btn-success">
        Assign Van
    </button>

</form>
</div>

</body>
</html>
